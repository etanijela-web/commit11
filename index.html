<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Course Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="app-header">
    <h1>Student Registration</h1>
    <p>ITDI110 - Week 9 JSON Practical</p>
</header>

<main class="container">

    <section class="card">
        <h2>Register Student</h2>

        <form id="studentForm">

            <div class="form-group">
                <label for="studentID">Student ID</label>
                <input type="text" id="studentID"
                       placeholder="Example: STU001" required>
                <small id="studentIDError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="studentName">Full Name</label>
                <input type="text" id="studentName"
                       placeholder="Example: Mary Tari" required>
                <small id="nameError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email"
                       placeholder="student@example.com" required>
                <small id="emailError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone"
                       placeholder="Example: 7712345" required>
                <small id="phoneError" class="error"></small>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="island">Island</label>
                    <input type="text" id="island"
                           placeholder="Example: Efate" required>
                </div>

                <div class="form-group">
                    <label for="province">Province</label>
                    <select id="province" required>
                        <option value="">Select Province</option>
                        <option value="Torba">Torba</option>
                        <option value="Sanma">Sanma</option>
                        <option value="Penama">Penama</option>
                        <option value="Malampa">Malampa</option>
                        <option value="Shefa">Shefa</option>
                        <option value="Tafea">Tafea</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="programme">Programme</label>
                <select id="programme" required>
                    <option value="">Select Programme</option>
                    <option value="Diploma in ICT">Diploma in ICT</option>
                    <option value="Certificate in ICT">Certificate in ICT</option>
                </select>
            </div>

            <div class="form-group">
                <label>Select Courses</label>

                <div class="courses">
                    <label>
                        <input type="checkbox" name="course" value="ITDI110">
                        ITDI110 - Object-Oriented Programming
                    </label>

                    <label>
                        <input type="checkbox" name="course" value="ITDI111">
                        ITDI111 - Databases
                    </label>

                    <label>
                        <input type="checkbox" name="course" value="ITDI112">
                        ITDI112 - Web Development
                    </label>
                </div>

                <small id="courseError" class="error"></small>
            </div>

            <button type="submit" class="btn-primary">
                Register Student
            </button>

        </form>

        <p id="message"></p>
    </section>

    <section class="card">
        <div class="section-heading">
            <h2>JSON Output</h2>

            <button id="downloadJSON" class="btn-secondary">
                Download JSON
            </button>
        </div>

        <pre id="jsonOutput">No JSON generated yet.</pre>
    </section>

    <section class="card">
        <h2>Registered Students</h2>

        <div id="studentList">
            <p>No students registered.</p>
        </div>
    </section>

</main>

<script type="module" src="js/app.js"></script>

</body>
</html>
